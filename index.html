<!DOCTYPE html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;padding:12px;max-width:2200px;margin:0 auto;-webkit-text-size-adjust:100%}

header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}

h1{font-size:30px}.tag{color:var(--ac);font-weight:600}
.note{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{font-size:24px}.sub{color:var(--mu)}
.meter{position:relative;height:24px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:4px 0}

.meter b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;text-shadow:0 1px 2px #000a}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;align-items:center}
button{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.warn{border-color:var(--hp)}
.mini button{min-height:36px;padding:4px 9px;font-size:14px}

.ab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.ab small{display:block;color:var(--mu)}.ab button{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 12px}

input,textarea,select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:100%}
select{min-height:44px}
.log,.rl{margin:8px 0 0;padding:0;list-style:none;color:var(--mu);font-size:14px}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cls button{text-align:left;padding:10px}.cls small{display:block;color:var(--mu)}
h3{font:600 13px "Source Sans 3",sans-serif;color:var(--mu);margin:12px 0 2px}
#err{color:var(--hp)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}.grid .card{margin:0}
.solo{max-width:980px;margin:0 auto}.solo .ab{padding:14px 0}.abx{display:flex;align-items:center;gap:16px;flex:1;min-width:0}.abt{min-width:0}.abx .abi{width:76px;height:76px;border-radius:12px;margin:0;flex:none;border:1px solid var(--ln);background:#0006}.abx .abe{font-size:46px;width:76px;text-align:center;margin:0;flex:none}.solo .abt b{font-size:17px}.solo .abt small{font-size:14px}.ref .abx .abi{width:64px;height:64px}.ref .abx .abe{font-size:40px;width:64px}.ref td{font-size:15px;padding:12px 10px}.ref td:nth-child(2){min-width:190px}.scn .abadge{position:absolute;left:8%;bottom:4%;width:min(26%,150px);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;animation:abin .35s .05s both;pointer-events:none}.scn .abadge .abi{width:52px;height:52px;border-radius:12px;border:2px solid var(--ac);background:#000a;box-shadow:0 0 14px #fc6a;margin:0}.scn .abadge .abe{font-size:36px;line-height:52px}.scn .abadge span.nm{font:700 12px "Source Sans 3",sans-serif;color:#fc6;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}@keyframes abin{from{opacity:0;transform:translateY(8px) scale(.8)}to{opacity:1;transform:none}}
.tbl.hl{grid-template-columns:auto 4.6fr minmax(185px,.7fr)!important}
.tbl{display:grid;grid-template-columns:minmax(170px,.55fr) 4.6fr minmax(185px,.7fr);gap:12px;align-items:start}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.pill{font-style:normal;font-size:12px;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:1px 8px}.pill.bad{border-color:var(--hp);color:var(--hp)}
.sb{padding:10px}.sb h2{font-size:20px}
.ref table{width:100%;border-collapse:collapse;margin:6px 0 18px}.ref th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--ln)}.ref td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:top;font-size:14px}.ref td:first-child,.ref td:nth-child(3){width:46px;text-align:center}.ref td:nth-child(2){white-space:nowrap}.ref h2{margin:14px 0 2px}.ref .row.mini{margin:6px 0}@media(max-width:600px){.ref td:nth-child(2){white-space:normal}}.spl{background:#111;color:#111;border:1px solid #555;border-radius:3px;padding:0 3px;user-select:none;-webkit-user-select:none}.abi{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:4px}.abe{margin-right:4px}.av{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid var(--ln)}
#map{width:100%;height:auto;display:block;touch-action:none;user-select:none;border:1px solid var(--ln);border-radius:8px;margin:8px 0}
.menu{border:1px solid var(--ac);border-radius:8px;padding:8px;margin:8px 0}
.dov{position:fixed;inset:0;pointer-events:none;z-index:50;perspective:900px}
.d3{position:absolute;left:0;top:0;width:84px;height:84px;transform-style:preserve-3d}

.d3 .f1{transform:translateZ(42px)}.d3 .f2{transform:rotateY(180deg) translateZ(42px)}.d3 .f3{transform:rotateY(90deg) translateZ(42px)}.d3 .f4{transform:rotateY(-90deg) translateZ(42px)}.d3 .f5{transform:rotateX(90deg) translateZ(42px)}.d3 .f6{transform:rotateX(-90deg) translateZ(42px)}

.dl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:90vw}
.dc{min-width:84px;height:84px;padding:0 10px;background:var(--sf);border:3px solid var(--ac);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 44px "Cormorant Garamond",Georgia,serif;box-shadow:0 8px 28px #0008}

.dt{background:var(--sf);border:2px solid var(--ac);border-radius:10px;padding:6px 16px;font:700 28px "Cormorant Garamond",Georgia,serif;box-shadow:0 8px 28px #0008}
@keyframes pop{0%{scale:.5}70%{scale:1.15}100%{scale:1}}
.efld{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.efld label{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}.efld input{width:70px}
.splash{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:470px;width:100%;margin:0 auto 6px;border:3px solid var(--fr);box-shadow:0 0 0 1px #000a,0 10px 26px -10px var(--fr);background:linear-gradient(160deg,#2b3140,#14171d)}
.splash .art{position:absolute;inset:0;background-size:cover;background-position:center 20%;display:flex;align-items:center;justify-content:center}
.splash .ph{font-size:110px;opacity:.35}
.splash .shade{position:absolute;inset:0;background:linear-gradient(to top,#000e 0%,#0009 26%,transparent 58%),linear-gradient(to bottom,#0008,transparent 20%)}
.splash .lvb{position:absolute;left:10px;top:10px;min-width:48px;text-align:center;background:var(--fr);color:#fff;border-radius:8px;font:700 26px/1 "Cormorant Garamond",Georgia,serif;padding:5px 9px;box-shadow:0 2px 8px #0008}
.splash .lvb small{display:block;font:600 10px "Source Sans 3",sans-serif;letter-spacing:.12em}
.splash .vc{position:absolute;right:10px;top:10px;font-size:24px;background:#000b;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--fr)}
.splash .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;color:#fff;text-shadow:0 1px 4px #000}

body.tbl{padding:0;max-width:none;background:#000}.tbl header,.tbl #err,.tbl #upd{display:none}

.sk-veins .d3 i,.sk-veins .dc,.sw.sk-veins{background:linear-gradient(115deg,transparent 38%,rgba(170,20,30,.65) 39.5%,transparent 41.5%),linear-gradient(62deg,transparent 56%,rgba(150,10,25,.55) 57%,transparent 59%),linear-gradient(170deg,transparent 70%,rgba(160,15,28,.5) 71%,transparent 73%),#efe8dc;color:#5b0a13;border-color:#b9423f}
.sk-galaxy .d3 i,.sk-galaxy .dc,.sw.sk-galaxy{background:radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2px),radial-gradient(circle at 75% 70%,#fff 0 1px,transparent 2px),radial-gradient(circle at 30% 20%,#7b4bd6,#1b1245 58%,#05030f);color:#fff;border-color:#8e6bd6}
.sk-gold .d3 i,.sk-gold .dc,.sw.sk-gold{background:linear-gradient(135deg,#fff1a8,#d4a017 45%,#8a5d00);color:#3a2600;border-color:#fff2b8}
.dicebox{position:fixed;inset:0;pointer-events:none}.dicebox canvas{pointer-events:none}
#upd{background:var(--ac);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:8px}#upd button{margin-left:8px;min-height:32px;padding:2px 10px}
#qte{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--sf);border:3px solid var(--hp);border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px #000a;max-width:92vw;text-align:center}

#ask{position:fixed;z-index:59;background:var(--sf);border:3px solid var(--ac);border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px #000a;text-align:center;max-width:92vw}#ask h2{font-size:22px}
.dw{font:600 18px "Source Sans 3",sans-serif;color:var(--tx);background:var(--sf);border:2px solid var(--ac);border-radius:8px;padding:2px 12px;margin-bottom:4px}
@media(max-width:860px){.tbl,.tbl.hl{grid-template-columns:1fr!important}.tbl .mid{order:-1}.cls{grid-template-columns:1fr}}
.scn{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);animation:scin .25s both;pointer-events:none}.scn.out{animation:scout .4s both}

.scn.s25 .stage{background:#07060d;perspective:700px}
