<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stamina Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#ece6d8;--sf:#f6f1e4;--tx:#2a2620;--mu:#6d6455;--ln:#cfc6b2;--ac:#a5571a;--hp:#b5443a;--st:#6f8f3d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1f242b;--sf:#2a303a;--tx:#e8e2d3;--mu:#a29a89;--ln:#3d4552;--ac:#e09a4a;--hp:#c9574b;--st:#9bbd62;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;padding:12px;max-width:1400px;margin:0 auto;-webkit-text-size-adjust:100%}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;margin:0}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}
header span{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:30px}.tag{color:var(--ac);font-weight:600}
.note{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{font-size:24px}.sub{color:var(--mu)}
.meter{position:relative;height:24px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%}.meter i.hp{background:var(--hp)}.meter i.st{background:var(--st)}
.meter b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;text-shadow:0 1px 2px #000a}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;align-items:center}
button{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.warn{border-color:var(--hp)}
.mini button{min-height:36px;padding:4px 9px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.ab small{display:block;color:var(--mu)}.ab button{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 12px}
.stats label,.stats span{display:flex;flex-direction:column;font-size:13px;color:var(--mu)}
.stats b{font-size:18px;color:var(--tx);font-weight:600}
input,textarea,select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:100%}
select{min-height:44px}
.log,.rl{margin:8px 0 0;padding:0;list-style:none;color:var(--mu);font-size:14px}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cls button{text-align:left;padding:10px}.cls small{display:block;color:var(--mu)}
h3{font:600 13px "Source Sans 3",sans-serif;color:var(--mu);margin:12px 0 2px}
#err{color:var(--hp)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}.grid .card{margin:0}
.solo{max-width:640px;margin:0 auto}
.tbl{display:grid;grid-template-columns:1fr 3fr 1fr;gap:12px;align-items:start}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.pill{font-style:normal;font-size:12px;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:1px 8px}.pill.bad{border-color:var(--hp);color:var(--hp)}
.sb{padding:10px}.sb h2{font-size:20px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid var(--ln)}
#map{width:100%;height:auto;display:block;touch-action:none;user-select:none;border:1px solid var(--ln);border-radius:8px;margin:8px 0}
@media(max-width:860px){.tbl{grid-template-columns:1fr}.tbl .mid{order:-1}.cls{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Stamina Table</h1><span><span class="tag" id="role"></span><button id="tab" hidden></button><button id="sw" hidden></button><button id="leave" hidden>Leave</button></span></header>
<div id="err"></div><div id="app"></div><input id="icf" type="file" accept="image/*" hidden>
<script>
const DB_URL="https://stamina-based-project-trial-default-rtdb.firebaseio.com";
const COM=[["Dash",1,"Move up to double your speed. Uses one of your 2 actions."],["Dodge Roll",3,"Reaction: DEX save against one attack, no advantage. Doesn't use an action.","r"],["Climb Foe",2,"Athletics check to mount a large enemy. While mounted it can't attack you, but you lose 4 stamina per round."]];
const C={
fighter:{n:"Fighter",d:"Tough, 2 stamina back per turn",hp:14,st:10,rg:2,ab:[["Power Strike",2,"+1d8 damage on a hit"],["Multi-Slash",3,"One extra attack this turn"],["Shield Bash",2,"STR save or target is knocked prone"],["Second Wind",3,"Heal 1d10 + level"]]},
archer:{n:"Archer",d:"Ranged, steady stamina",hp:11,st:10,rg:2,ab:[["Piercing Shot",2,"+1d6, ignores half cover"],["Triple Volley",3,"Three arrows, each at -2 to hit"],["Pinning Shot",2,"DEX save or speed 0 until your next turn"],["Hunter's Eye",1,"Mark a weak point: next hit crits on 19-20"]]},
mage:{n:"Mage",d:"Big pool, slow regen",hp:9,st:14,rg:1,ab:[["Firebolt",1,"2d10 fire, ranged"],["Ember Burst",4,"20 ft radius, 6d6 fire, DEX half"],["Arcane Ward",3,"Absorb 5 + level damage"],["Mending Light",3,"Heal 2d8 + INT, once per turn"]]},
thief:{n:"Thief",d:"Quick, opportunistic",hp:10,st:10,rg:2,ab:[["Backstab",2,"+2d6 with advantage or ally adjacent"],["Cutting Flurry",2,"Two quick light-weapon attacks"],["Smoke Bomb",3,"5 ft cloud, heavily obscured, free Disengage"],["Pilfer",1,"Sleight of Hand to lift an item mid-fight"]]}};
const NUM=[["level","Level"],["ac","AC"],["maxHp","Max HP"],["maxSt","Max stamina"],["rg","Regen/turn"],["spd","Speed (sq)"],["maxFl","Flasks max"],["souls","Souls"],["str","STR"],["dex","DEX"],["con","CON"],["int","INT"],["wis","WIS"],["cha","CHA"]];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ABS=c=>COM.concat((C[c.cls]||C.fighter).ab),DASH=COM[0][1],K=(x,y)=>x+","+y,clamp=(v,m)=>Math.max(0,Math.min(m,v)),mod=s=>Math.floor(((s||10)-10)/2),sg=n=>n>=0?"+"+n:""+n;
let pin="",role="",me="",dm=false,canGM=false,chars={},enemies={},maps={},cur=null,rolls={},secret=[],IM={},view="table",gmMap=null,sel=null,tool="move",P=null,last="",pending=false,timer=null,bonus=0,dstat="",secOn=true;
let IC={},iconFor=null,claimMode=false,myClaim=null,claims={};
const ok=c=>c.ap!==false&&c.ap!=="no",A=()=>Object.keys(chars).filter(i=>ok(chars[i]));
const av=(id,o)=>o.iv&&IC[id]&&IC[id].data?`<img class="av" src="${IC[id].data}" alt="">`:"";
const claimsHtml=()=>{const l=Object.entries(claims||{}).filter(([k,c])=>c.st==="pending");return l.length?`<div class="card sb"><h2>Device requests</h2>${l.map(([k,c])=>`<div class="ab"><div><b>${esc(c.who)}</b> wants to take over <b>${esc(chars[c.target]?chars[c.target].name:"a deleted character")}</b></div><span class="row mini"><button class="pri" data-a="callow" data-id="${k}">Allow</button><button data-a="cdeny" data-id="${k}">Deny</button></span></div>`).join("")}</div>`:""};
const claimForm=()=>{const l=A();return`<div class="card"><h2>Take over your character</h2><h3>Your name (so the GM knows who is asking)</h3><input id="cn" maxlength="30" placeholder="e.g. Sam"><h3>Which character is yours?</h3><select id="ct">${l.map(i=>`<option value="${i}">${esc(chars[i].name)}</option>`).join("")}</select><div class="row" style="margin-top:10px"><button class="pri" data-a="csend" ${l.length?"":"disabled"}>Ask the GM</button><button data-a="cmode">Back</button></div></div>`};
const claimWait=()=>`<div class="card"><h2>${myClaim.st==="no"?"Request declined":"Waiting for the GM"}</h2><p class="note">${myClaim.st==="no"?"The GM didn't approve linking this device.":`You asked to take over ${esc((chars[myClaim.target]||{}).name||"that character")}. This page updates by itself once the GM allows it.`}</p>${myClaim.st==="no"?`<button data-a="cdismiss">Back</button>`:""}</div>`;
const pendingHtml=()=>claimsHtml()+pendingHtml0();
const pendingHtml0=()=>{const l=Object.keys(chars).filter(i=>!ok(chars[i])||chars[i].ap===false);return l.length?`<div class="card sb"><h2>Join requests</h2>${l.map(i=>{const c=chars[i];return`<div class="ab"><div><b>${esc(c.name)}</b><small>${(C[c.cls]||C.fighter).n}${c.ap==="no"?" · declined":""}</small></div><span class="row mini"><button class="pri" data-a="allow" data-id="${i}">Allow</button>${c.ap===false?`<button data-a="deny" data-id="${i}">Deny</button>`:""}</span></div>`}).join("")}</div>`:""};
const waitHtml=()=>{const c=chars[me],no=c.ap==="no";return`<div class="solo"><div class="card"><h2>${no?"Request declined":"Waiting to be allowed to play"}</h2><p class="note">${no?"The GM hasn't approved this character. If that's a mistake, ask your GM. This page updates by itself if they allow you.":`Your Game Master needs to approve ${esc(c.name)} before you can join the table. This page updates by itself once you're in.`}</p></div></div>`};
const fail=e=>{$("#err").textContent="Connection problem: "+(e.message||e)};
const store=()=>{try{localStorage.setItem("st",JSON.stringify({pin,role,me}))}catch(e){}};
const saved=()=>{try{return JSON.parse(localStorage.getItem("st")||"{}")}catch(e){return{}}};
async function api(p,m,b,q){const r=await fetch(DB_URL.replace(/\/$/,"")+"/tables/"+pin+"/"+p+".json"+(q||""),{method:m||"GET",body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const meter=(v,m,k)=>`<div class="meter"><i class="${k}" style="width:${m?Math.max(0,Math.min(100,v/m*100)):0}%"></i><b>${v} / ${m}</b></div>`;
const mapId=()=>{const ids=Object.keys(maps),c=cur&&maps[cur]?cur:ids[0];return dm&&gmMap&&maps[gmMap]?gmMap:c};
/* ---------- characters ---------- */
function turn(c){const p={used:0,exh:false,pr:false,lh:0},d=c.mt==="climb"?4:0,s=c.st+c.rg-d;let m="New round";
 if(d&&s<=0){p.st=0;p.mt="";p.exh=true;m="Drained while climbing: fell off, exhausted!"}else{p.st=clamp(s,c.maxSt);if(d)m="Climbing (-4 St)"}return[p,m]}
const abBtn=(id,i,a,c,label)=>{const re=a[3]==="r",off=c.exh||(!re&&(c.used||0)>=2);return`<button data-a="use" data-id="${id}" data-i="${i}" class="${c.st<a[1]?"warn":""}" ${off?"disabled":""}>${label||a[1]+" St"}</button>`};
const mtCtl=(id,c)=>c.mt?`<div class="row mini"><button data-a="unmount" data-id="${id}">Unmount</button><button data-a="mtd" data-id="${id}">${c.mt==="climb"?"Foe is down":"Foe is up"}</button></div>`:"";
const hpBtns=id=>[-5,-1,1,5].map(n=>`<button data-a="hp" data-id="${id}" data-n="${n}">${n>0?"+":""}${n}</button>`).join("");
function pillsOf(c){const x=[];if(c.mt)x.push(c.mt==="climb"?"Mounted: -4 St/round":"On a downed foe");if(c.exh)x.push("Exhausted");if(c.pr)x.push("Prone");if(c.conds)x.push(c.conds);return x.length?`<div class="pills">${x.map(t=>`<i class="pill ${/Exh|Prone/.test(t)?"bad":""}">${esc(t)}</i>`).join("")}</div>`:""}
function sbox(id){
 const c=chars[id],own=dm||id===me,net=c.rg-(c.mt==="climb"?4:0);
 let h=`<div class="card sb"><div class="top"><h2>${av(id,c)}${esc(c.name)}</h2><span class="sub">${(C[c.cls]||C.fighter).n} · Actions ${c.used||0}/2</span></div>${meter(c.hp,c.maxHp,"hp")}${meter(c.st,c.maxSt,"st")}${pillsOf(c)}`;
 if(own)h+=`<div class="row mini"><button class="pri" data-a="regen" data-id="${id}">Start of turn ${sg(net)}</button><button data-a="flask" data-id="${id}" ${c.fl<1?"disabled":""}>Flask ${c.fl}/${c.maxFl}</button>${dm?hpBtns(id):""}<button data-a="icon" data-id="c:${id}">Icon</button></div>${mtCtl(id,c)}`;
 if(dm&&c.exh)h+=`<div class="row mini"><button data-a="hit" data-id="${id}" data-k="l">Light hit (${c.lh||0}/3)</button><button data-a="hit" data-id="${id}" data-k="h">Heavy hit</button></div>`;
 return h+`</div>`}
function quick(id){const c=chars[id];return`<div class="card sb"><h3>Quick actions (2 per round, Dodge is a reaction)</h3><div class="row mini">${ABS(c).map((a,i)=>abBtn(id,i,a,c,esc(a[0])+" · "+a[1])).join("")}</div></div>`}
function allies(){const m=chars[me];if(!m)return"";const l=A().filter(i=>i!==me&&(chars[i].exh||chars[i].pr));return l.length?`<div class="card sb"><h3>Allies down</h3>${l.map(i=>`<button data-a="help" data-id="${i}" ${m.exh||(m.used||0)>=2?"disabled":""}>Help ${esc(chars[i].name)} up (uses an action)</button>`).join("")}</div>`:""}
function card(id){
 const c=chars[id],k=C[c.cls]||C.fighter,own=dm||id===me;
 let h=`<div class="card"><div class="top"><h2>${av(id,c)}${esc(c.name)}</h2><span class="sub">${k.n} · Lv ${c.level} · AC ${c.ac}</span></div>${pillsOf(c)}`;
 h+=`<h3>Health</h3>${meter(c.hp,c.maxHp,"hp")}`;
 if(own)h+=`<div class="row">${hpBtns(id)}<button data-a="flask" data-id="${id}" ${c.fl<1?"disabled":""}>Flask (${c.fl}/${c.maxFl})</button></div>`;
 h+=`<h3>Stamina · Actions used ${c.used||0}/2</h3>${meter(c.st,c.maxSt,"st")}`;
 if(own)h+=`<div class="row"><button class="pri" data-a="regen" data-id="${id}">Start of turn ${sg(c.rg-(c.mt==="climb"?4:0))}</button><button data-a="rest" data-id="${id}">Bonfire rest</button><button data-a="icon" data-id="c:${id}">Set icon</button>${dm?`<button data-a="st" data-id="${id}" data-n="-1">-1 St</button><button data-a="st" data-id="${id}" data-n="1">+1 St</button>`:""}</div>${mtCtl(id,c)}`;
 h+=`<h3>Abilities (basic attacks are free)</h3>`;
 ABS(c).forEach((a,i)=>{h+=`<div class="ab"><div>${esc(a[0])}${a[3]?" (reaction)":""}<small>${esc(a[2])}</small></div>${own?abBtn(id,i,a,c):`<span class="sub">${a[1]} St</span>`}</div>`});
 h+=`<h3>Stats</h3><div class="stats">`;
 NUM.forEach(([f,l])=>{h+=dm?`<label>${l}<input type="number" data-id="${id}" data-f="${f}" value="${c[f]??0}"></label>`:`<span>${l}<b>${c[f]??0}</b></span>`});
 h+=`</div><h3>Conditions</h3><input data-id="${id}" data-f="conds" value="${esc(c.conds)}" ${own?"":"disabled"} placeholder="e.g. Poisoned">`;
 h+=`<h3>Notes</h3><textarea rows="2" data-id="${id}" data-f="notes" ${own?"":"disabled"}>${esc(c.notes)}</textarea>`;
 const lg=(c.log||[]).slice(-5).reverse();
 if(lg.length)h+=`<ul class="log">${lg.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
 if(dm)h+=`<div class="row"><button data-a="del" data-id="${id}">Remove character</button></div>`;
 return h+`</div>`}
function create(){if(claimMode)return claimForm();
 const ex=[];
 return `<div class="card"><h2>Create your character</h2><h3>Name</h3><input id="nm" maxlength="40" placeholder="Character name"><h3>Vocation</h3><div class="cls">${Object.entries(C).map(([k,v])=>`<button data-a="make" data-k="${k}"><b>${v.n}</b><small>${v.d}</small></button>`).join("")}</div><h3>Played here before, on another device?</h3><button data-a="cmode">I already have a character</button>${ex.length?`<h3>Or continue as an existing character</h3><div class="row">${ex.map(([i,c])=>`<button data-a="claim" data-id="${i}">${esc(c.name)}</button>`).join("")}</div>`:""}</div>`}
function joinScreen(){
 return `<div class="solo"><div class="card"><h2>Join a table</h2><h3>Table PIN (6+ letters or numbers)</h3><input id="pin" maxlength="30" autocomplete="off" placeholder="e.g. dragon4821">
 <div class="row"><button class="pri" data-a="joinP">Join as player</button></div>
 <h3>Game Master PIN (sets it if the table is new)</h3><input id="gpin" type="password" autocomplete="off" placeholder="GM PIN">
 <div class="row"><button data-a="joinGM">Open as Game Master</button></div></div></div>`}
/* ---------- enemies and dice ---------- */
function enemiesHtml(){
 const ids=Object.keys(enemies);
 let h=`<div class="card"><h2>Enemies</h2>`;
 h+=ids.length?ids.map(i=>{const e=enemies[i];return`<div class="ab"><div>${av(i,e)}<b>${esc(e.name)}</b><small>${esc(e.type)}${e.mx==null?" · not placed":""}</small>${dm?meter(e.hp,e.max,"hp")+`<div class="row mini">${[-5,-1,1,5].map(n=>`<button data-a="eh" data-id="${i}" data-n="${n}">${n>0?"+":""}${n}</button>`).join("")}<button data-a="icon" data-id="e:${i}">Icon</button><button data-a="edel" data-id="${i}">Remove</button></div>`:""}</div></div>`}).join(""):`<p class="note">None in sight.</p>`;
 if(dm)h+=`<h3>Add enemy</h3><input id="en" maxlength="30" placeholder="Name"><input id="et" list="tp" maxlength="30" placeholder="Type" style="margin-top:6px"><datalist id="tp"><option>Goblin<option>Troll<option>Ogre<option>Griffin<option>Dragon<option>Wolf</datalist><input id="eh" type="number" placeholder="HP" style="margin-top:6px"><div class="row" style="margin-top:6px"><button data-a="eadd">Add</button></div>`;
 return h+`</div>`}
function diceHtml(){
 const c=chars[me],l=Object.values(rolls||{}).concat(dm?secret.map(s=>({...s,s:1})):[]).sort((a,b)=>a.ts-b.ts).slice(-12).reverse();
 let h=`<div class="card"><h2>Dice</h2><div class="row mini">${[4,6,8,10,12,20,100].map(n=>`<button data-a="die" data-n="${n}">d${n}</button>`).join("")}</div><div class="row"><input id="db" type="number" value="${bonus}" style="width:80px" aria-label="Bonus">`;
 if(!dm&&c)h+=`<select id="ds" style="width:auto">${[["","No stat"],...["str","dex","con","int","wis","cha"].map(s=>[s,s.toUpperCase()+" "+sg(mod(c[s]))])].map(([v,t])=>`<option value="${v}" ${dstat===v?"selected":""}>${t}</option>`).join("")}</select>`;
 if(dm)h+=`<label class="sub"><input type="checkbox" id="sec" ${secOn?"checked":""} style="width:auto"> Secret</label>`;
 return h+`</div><ul class="rl">${l.map(r=>`<li>${r.s?"🔒 ":""}${esc(r.n)} rolled d${r.d}: <b>${r.r}</b>${r.m?` ${sg(r.m)} = <b>${r.r+r.m}</b>`:""}</li>`).join("")||"<li>No rolls yet.</li>"}</ul></div>`}
function roll(d){
 const c=chars[me],m=(+bonus||0)+(!dm&&dstat&&c?mod(c[dstat]):0),r=1+Math.floor(Math.random()*d),e={n:dm?"GM":(c?c.name:"?"),d,r,m,ts:Date.now()};
 if(dm&&secOn){secret.push(e);secret=secret.slice(-12);render()}else api("rolls","POST",e).then(()=>{last="";load()}).catch(fail)}
/* ---------- map ---------- */
function geo(){const id=mapId(),m=maps[id],im=IM[id];if(!m||!im)return null;const cols=m.cols||24,cs=m.w/cols;return{id,m,im,cols,cs,rows:Math.floor(m.h/cs),W:new Set(Object.values(m.walls||{}))}}
function who(){const s=dm?sel:"c:"+me;if(!s)return null;const e=s[0]==="e",id=s.slice(2),o=(e?enemies:chars)[id];return o?{e,id,o}:null}
function cellAt(e){const g=geo(),v=$("#map");if(!g||!v)return null;const r=v.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*g.cols),y=Math.floor((e.clientY-r.top)/r.height*g.m.h/g.cs);return x<0||y<0||x>=g.cols||y>=g.rows?null:[x,y]}
function reach(c,g){const sp=c.spd||6,lim=c.exh?Math.floor(sp/2):2*sp,d={[K(c.mx,c.my)]:0},q=[[c.mx,c.my]];while(q.length){const[x,y]=q.shift(),n=d[K(x,y)];if(n>=lim)continue;for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++){const a=x+dx,b=y+dy,k=K(a,b);if(!(dx||dy)||a<0||b<0||a>=g.cols||b>=g.rows||g.W.has(k)||d[k]!==undefined)continue;if(dx&&dy&&(g.W.has(K(x+dx,y))||g.W.has(K(x,y+dy))))continue;d[k]=n+1;q.push([a,b])}}return d}
const wallsSvg=(W,cs)=>[...W].map(k=>{const[x,y]=k.split(",");return`<rect x="${x*cs}" y="${y*cs}" width="${cs}" height="${cs}" style="fill:#14110e;fill-opacity:.85"/>`}).join("");
function mapTools(){
 const ids=Object.keys(maps),g=geo();
 return`<div class="row"><select id="msel" style="width:auto;flex:1">${ids.map(i=>`<option value="${i}" ${i===mapId()?"selected":""}>${esc(maps[i].name)}${i===(cur&&maps[cur]?cur:ids[0])?" (live)":""}</option>`).join("")}</select><button data-m="mnew">New map</button><input id="mf" type="file" accept="image/*" hidden>${ids.length?`<button data-m="mshow">Show to players</button><button data-m="mren">Rename</button><button data-m="mdel">Delete</button>`:""}</div>${g?`<div class="row"><label class="sub">Squares across <input id="mc" type="number" min="5" max="80" value="${g.cols}" style="width:72px"></label><button data-m="grid">Grid: ${g.m.grid===false?"off":"on"}</button><button data-m="tool" data-k="move" ${tool==="move"?'class="pri"':""}>Move tokens</button><button data-m="tool" data-k="wall" ${tool==="wall"?'class="pri"':""}>Draw walls</button><button data-m="clr">Clear walls</button></div>`:""}`}
function mapHtml(){
 const ids=Object.keys(maps),g=geo();
 if(!ids.length)return`<div class="card"><p class="note">${dm?"No maps yet. Upload one to begin.":"The GM hasn't set a map yet."}</p>${dm?mapTools():""}</div>`;
 if(!g)return`<div class="card"><p class="note">Loading map…</p>${dm?mapTools():""}</div>`;
 const{m,im,cols,cs,rows,W}=g,s=who(),c=s&&!s.e?s.o:null,sp=c?c.spd||6:6,wl=c&&c.exh?Math.floor(sp/2):sp,R=c&&c.mx!=null?reach(c,g):{};
 let v=`<svg id="map" viewBox="0 0 ${m.w} ${m.h}"><image href="${im.data}" width="${m.w}" height="${m.h}"/>`;
 for(const k in R){if(!R[k])continue;const[x,y]=k.split(",");v+=`<rect x="${x*cs}" y="${y*cs}" width="${cs}" height="${cs}" style="fill:${R[k]<=wl?"var(--st)":(c.used||0)>=2?"var(--hp)":"var(--ac)"};fill-opacity:.4"/>`}
 v+=`<g id="wl">${wallsSvg(W,cs)}</g>`;
 if(m.grid!==false){let d="";for(let i=0;i<=cols;i++)d+=`M${i*cs} 0V${rows*cs}`;for(let j=0;j<=rows;j++)d+=`M0 ${j*cs}H${cols*cs}`;v+=`<path d="${d}" style="stroke:#000;stroke-opacity:.9;stroke-width:${Math.max(2,m.w/450)};fill:none"/>`}
 const tk=(o,key,en)=>{if(o.mx==null)return"";const id=key.slice(2),x=(o.mx+.5)*cs,y=(o.my+.5)*cs,r=cs*.4,sl=key===(dm?sel:"c:"+me)?"#fff":(en?"var(--hp)":"#000"),ic=IC[id],img=o.iv&&ic&&ic.data,ring=`<circle cx="${x}" cy="${y}" r="${r}" style="fill:${en?"var(--hp)":"var(--ac)"};stroke:${sl};stroke-width:${cs/10}"/>`;return img?ring+`<clipPath id="cp${id}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath><image href="${ic.data}" x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${id})"/><circle cx="${x}" cy="${y}" r="${r}" style="fill:none;stroke:${sl};stroke-width:${cs/10}"/>`:ring+`<text x="${x}" y="${y}" text-anchor="middle" dy=".35em" style="fill:#fff;font:600 ${cs*.45}px sans-serif">${esc((o.name||"?")[0])}</text>`};
 for(const i in chars)if(ok(chars[i]))v+=tk(chars[i],"c:"+i,false);for(const i in enemies)v+=tk(enemies[i],"e:"+i,true);
 v+="</svg>";
 const chip=(k,t)=>`<button data-m="sel" data-id="${k}" ${k===sel?'class="pri"':""}>${esc(t)}</button>`;
 const chips=dm?A().map(i=>chip("c:"+i,chars[i].name)).concat(Object.keys(enemies).map(i=>chip("e:"+i,"👹 "+enemies[i].name))).join(""):"";
 const info=!s?(dm?"Pick a character or enemy to place or move it.":""):s.e?"As GM you can place enemies anywhere.":c.mx==null?"Tap the map to place your token.":c.exh?`Exhausted: walk only, up to ${wl} squares (green).`:`Walk up to ${sp} squares (green): free. Dash up to ${2*sp} (${(c.used||0)>=2?"red, no actions left":"amber"}): ${DASH} stamina and 1 action; short on stamina means exhaustion. Walls block the way.`;
 return`<div class="card">${chips?`<div class="row mini">${chips}</div>`:""}${v}<p class="note">${info}${dm&&tool==="wall"?" Tap or drag to draw walls.":""}${dm&&mapId()!==(cur&&maps[cur]?cur:ids[0])?" You're editing a map players can't see yet.":""}</p>${dm?mapTools():""}</div>`}
const paint=p=>{const k=K(p[0],p[1]);if(P.add===P.W.has(k))return;P.add?P.W.add(k):P.W.delete(k);$("#wl").innerHTML=wallsSvg(P.W,geo().cs)};
const setM=p=>{const id=mapId();maps[id]={...maps[id],...p};last="";render();api("maps/"+id,"PUT",maps[id]).catch(fail)};
function loadImg(f){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let sc=Math.min(1,1400/i.width);for(;;){const c=document.createElement("canvas");c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);c.getContext("2d").drawImage(i,0,0,c.width,c.height);for(const q of[.8,.65,.5,.35]){const d=c.toDataURL("image/jpeg",q);if(d.length<700000){const id="m"+Date.now().toString(36),iv=Date.now(),m={name:(f.name||"Map").replace(/\.[^.]+$/,"").slice(0,30),cols:24,grid:true,w:c.width,h:c.height,iv};api("mapimg/"+id,"PUT",{data:d}).then(()=>{IM[id]={data:d,iv};maps[id]=m;gmMap=id;if(!cur){cur=id;api("cur","PUT",id)}last="";render();return api("maps/"+id,"PUT",m)}).catch(fail);return}}sc*=.8}};i.src=r.result};r.readAsDataURL(f)}
/* ---------- render / sync ---------- */
function render(){
 $("#role").textContent=role?(dm?"Game Master":"Player"):"";$("#leave").hidden=!role;$("#tab").hidden=!role||(!dm&&!(chars[me]&&ok(chars[me])));$("#sw").hidden=!canGM||!role;
 $("#tab").textContent=view==="sheet"?"Table":"Sheet";$("#sw").textContent=dm?"View as player":"Back to GM";
 let h="";
 if(!role)h=joinScreen();
 else if(!dm&&!chars[me])h='<div class="solo">'+(myClaim?claimWait():create())+'</div>';
 else if(!dm&&!ok(chars[me]))h=waitHtml();
 else if(view==="sheet")h=dm?pendingHtml()+(A().length?'<div class="grid">'+A().map(card).join("")+'</div>':'<p class="note">No approved characters yet.</p>'):'<div class="solo">'+card(me)+'</div>';
 else{
  const left=dm?pendingHtml()+`<div class="card sb"><div class="row"><button class="pri" data-a="regenAll">Next round: all</button><button data-a="restAll">Bonfire: all</button></div></div>`+(A().map(sbox).join("")||`<p class="note">No characters yet. Table PIN: <b>${esc(pin)}</b></p>`):sbox(me)+quick(me)+allies();
  h=`<div class="tbl"><div>${left}</div><div class="mid">${mapHtml()}</div><div>${enemiesHtml()}${diceHtml()}</div></div>`}
 $("#app").innerHTML=h;pending=false}
async function load(){
 try{
  const[c0,e0,mp0,cu0,rl,cl]=await Promise.all([api("chars"),api("enemies"),api("maps"),api("cur"),api("rolls","GET",undefined,"?orderBy=%22%24key%22&limitToLast=20"),dm?api("claims"):api("claims/"+me)]);
  if(P)return;
  const need=[];for(const o of[c0||{},e0||{}])for(const[i,x]of Object.entries(o))if(x.iv&&(!IC[i]||IC[i].iv!==x.iv))need.push([i,x.iv]);
  await Promise.all(need.map(async([i,iv])=>{const d=await api("icons/"+i);if(d)IC[i]={iv,data:d.data}}));
  const mps=mp0||{},ids=Object.keys(mps),live=cu0&&mps[cu0]?cu0:ids[0],id=dm&&gmMap&&mps[gmMap]?gmMap:live;
  if(id&&(!IM[id]||IM[id].iv!==mps[id].iv)){const d=await api("mapimg/"+id);if(d)IM[id]={data:d.data,iv:mps[id].iv}}
  if(dm)claims=cl||{};else if(cl&&cl.st==="ok"){const old=me;me=cl.target;store();api("claims/"+old,"DELETE").catch(fail);myClaim=null;claimMode=false;last=""}else myClaim=cl||null;
  const sig=JSON.stringify([c0,e0,mp0,cu0,rl,cl,id,id&&IM[id]?IM[id].iv:0]);$("#err").textContent="";if(sig===last)return;last=sig;
  chars=c0||{};enemies=e0||{};maps=mps;cur=cu0;rolls=rl||{};if(dm&&id)gmMap=id;
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("#app").contains(a))pending=true;else render();
 }catch(e){fail(e)}}
async function start(){canGM=dm=role==="gm";gmMap=null;store();await load();render();clearInterval(timer);timer=setInterval(load,3000)}
function upd(id,p,msg){
 const c=chars[id];if(!c||(!dm&&id!==me))return;
 const l=(c.log||[]).slice(-9);if(msg)l.push(msg);
 const q={...p,log:l};chars[id]={...c,...q};render();
 api("chars/"+id,"PATCH",q).catch(fail)}
function updE(id,p){enemies[id]={...enemies[id],...p};render();api("enemies/"+id,"PATCH",p).catch(fail)}
function useAb(id,i){
 const c=chars[id],a=ABS(c)[i],re=a[3]==="r";if(!c||c.exh||(!re&&(c.used||0)>=2))return;
 const p={};let msg="Used "+a[0]+" (-"+a[1]+" St)";
 if(c.st>=a[1])p.st=c.st-a[1];else{p.st=0;p.exh=true;p.mt="";msg="Used "+a[0]+" without enough stamina: EXHAUSTED"}
 if(!re)p.used=(c.used||0)+1;
 if(a[0]==="Climb Foe"&&!p.exh)p.mt="climb";
 upd(id,p,msg)}
/* ---------- events ---------- */
$("#app").addEventListener("click",async e=>{
 const bm=e.target.closest("[data-m]");
 if(bm){const m=bm.dataset.m;
  if(m==="mnew")$("#mf").click();
  else if(m==="sel"){sel=bm.dataset.id;render()}
  else if(m==="tool"){tool=bm.dataset.k;render()}
  else if(m==="grid")setM({grid:geo().m.grid===false});
  else if(m==="clr"&&confirm("Remove all walls on this map?"))setM({walls:[]});
  else if(m==="mshow"){cur=mapId();last="";render();api("cur","PUT",cur).catch(fail)}
  else if(m==="mren"){const n=prompt("Map name",maps[mapId()].name);if(n)setM({name:n.slice(0,30)})}
  else if(m==="mdel"&&confirm("Delete this map?")){const id=mapId();delete maps[id];delete IM[id];gmMap=null;if(cur===id){cur=Object.keys(maps)[0]||null;api("cur","PUT",cur).catch(fail)}last="";render();api("maps/"+id,"DELETE").catch(fail);api("mapimg/"+id,"DELETE").catch(fail)}
  return}
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 const a=b.dataset.a,id=b.dataset.id,c=chars[id],n=+b.dataset.n;
 if(a==="joinP"||a==="joinGM"){
  const p=$("#pin").value.trim();
  if(!/^[A-Za-z0-9]{6,30}$/.test(p)){$("#err").textContent="Table PIN: 6 or more letters/numbers only.";return}
  pin=p;
  try{
   const meta=await api("meta");
   if(a==="joinP"){
    if(!meta){$("#err").textContent="No table with that PIN. Ask your GM to open it first.";return}
    role="player";const s=saved();me=(s.pin===pin&&s.me)||"p"+Math.random().toString(36).slice(2,10);
   }else{
    const g=$("#gpin").value;if(g.length<4){$("#err").textContent="GM PIN needs 4+ characters.";return}
    const gh=await hash(g);
    if(!meta)await api("meta","PUT",{dm:gh});else if(meta.dm!==gh){$("#err").textContent="Wrong GM PIN.";return}
    role="gm";me="gm";
   }
   $("#err").textContent="";start();
  }catch(x){fail(x)}
 }
 else if(a==="make"){
  const k=C[b.dataset.k],name=($("#nm").value||"").trim()||"Nameless";
  const d={name,cls:b.dataset.k,level:1,ac:12,hp:k.hp,maxHp:k.hp,st:k.st,maxSt:k.st,rg:k.rg,fl:3,maxFl:3,souls:0,spd:6,str:10,dex:10,con:10,int:10,wis:10,cha:10,conds:"",notes:"",used:0,ap:me==="gm",log:["Joined the party"]};
  chars[me]=d;render();api("chars/"+me,"PUT",d).catch(fail);
 }
 else if(a==="claim"){me=id;store();render()}
 else if(a==="regenAll"){A().forEach(i=>{const[p,m]=turn(chars[i]);upd(i,p,m)})}
 else if(a==="restAll"){A().forEach(i=>{const x=chars[i];upd(i,{hp:x.maxHp,st:x.maxSt,fl:x.maxFl,used:0,exh:false,pr:false,lh:0},"Rested at the bonfire")})}
 else if(a==="hp")upd(id,{hp:clamp(c.hp+n,c.maxHp)},(n>0?"Healed ":"Took ")+Math.abs(n));
 else if(a==="st")upd(id,{st:clamp(c.st+n,c.maxSt)});
 else if(a==="regen"){const[p,m]=turn(c);upd(id,p,m)}
 else if(a==="rest")upd(id,{hp:c.maxHp,st:c.maxSt,fl:c.maxFl,used:0,exh:false,pr:false,lh:0},"Rested at the bonfire");
 else if(a==="flask"&&c.fl>0){const h=Math.floor(c.maxHp*.4);upd(id,{fl:c.fl-1,hp:clamp(c.hp+h,c.maxHp)},"Drank a flask (+"+h+" HP)")}
 else if(a==="use")useAb(id,+b.dataset.i);
 else if(a==="unmount")upd(id,{mt:""},"Unmounted");
 else if(a==="mtd")upd(id,{mt:c.mt==="climb"?"down":"climb"},c.mt==="climb"?"Foe knocked down: no drain":"Foe is back up: -4 St per round");
 else if(a==="hit"){const lh=(c.lh||0)+(b.dataset.k==="l"?1:0),pr=b.dataset.k==="h"||lh>=3;upd(id,{lh:pr?0:lh,pr:pr||!!c.pr},pr?"Knocked prone!":"Light hit "+lh+"/3")}
 else if(a==="help"){const m=chars[me];if(!m||!c||m.exh||(m.used||0)>=2)return;const l=(c.log||[]).slice(-9);l.push("Helped up by "+m.name);chars[id]={...c,exh:false,pr:false,log:l};api("chars/"+id,"PATCH",{exh:false,pr:false,log:l}).catch(fail);upd(me,{used:(m.used||0)+1},"Helped "+c.name+" up")}
 else if(a==="cmode"){claimMode=!claimMode;render()}
 else if(a==="csend"){const who=$("#cn").value.trim().slice(0,30),t=$("#ct").value;if(!who||!t){$("#err").textContent="Enter your name and pick a character.";return}$("#err").textContent="";myClaim={who,target:t,st:"pending",ts:Date.now()};claimMode=false;render();api("claims/"+me,"PUT",myClaim).catch(fail)}
 else if(a==="cdismiss"){myClaim=null;render();api("claims/"+me,"DELETE").catch(fail)}
 else if(a==="callow"||a==="cdeny"){const st=a==="callow"?"ok":"no";if(claims[id])claims[id].st=st;render();api("claims/"+id,"PATCH",{st}).catch(fail)}
 else if(a==="allow")upd(id,{ap:true},"Approved by the GM");
 else if(a==="deny")upd(id,{ap:"no"},"Declined by the GM");
 else if(a==="icon"){iconFor=id;$("#icf").value="";$("#icf").click()}
 else if(a==="die")roll(n);

 else if(a==="eh"){const x=enemies[id];updE(id,{hp:clamp(x.hp+n,x.max)})}

});
$("#app").addEventListener("pointerdown",e=>{
 if(!e.target.closest("#map"))return;const g=geo(),p=cellAt(e);if(!g||!p)return;const[x,y]=p,k=K(x,y);
 if(dm&&tool==="wall"){P={add:!g.W.has(k),W:new Set(g.W)};paint(p);return}
 const s=who();if(!s)return;
 if(s.e){if(dm)updE(s.id,{mx:x,my:y});return}

 if(c.mx==null||dm){upd(s.id,{mx:x,my:y},c.mx==null?"Placed on the map":"");return}
 const sp=c.spd||6,n=reach(c,g)[k];if(!n)return;
 if(n<=sp){upd(s.id,{mx:x,my:y},"Moved "+n+" squares");return}
 if((c.used||0)>=2)return;
 const ok=c.st>=DASH;upd(s.id,{mx:x,my:y,used:(c.used||0)+1,st:ok?c.st-DASH:0,...(ok?{}:{exh:true,mt:""})},ok?"Dashed "+n+" squares (-"+DASH+" St)":"Dashed "+n+" squares without stamina: EXHAUSTED")});
addEventListener("pointermove",e=>{if(P){const p=cellAt(e);if(p)paint(p)}});

 const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const q=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-q)/2,(i.height-q)/2,q,q,0,0,96,96);const d=c.toDataURL("image/jpeg",.8),iv=Date.now();

(async()=>{
