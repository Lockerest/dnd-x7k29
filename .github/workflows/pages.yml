# Builds and publishes the site to GitHub Pages on every push to main.
#   - The app (app/) is published at the site root, so your players' link does not change.
#     The old /next/ address forwards to it.
#   - The old single-file page (classic/index.html) is kept as a backup at /classic/.
# Nothing is published if a check fails, so a broken upload never reaches the table.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm run test:coverage

      - name: Build the new app
        run: npm run build

      - name: Browser tests (old page rules, parity, built app)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Assemble the site
        working-directory: .
        run: |
          mkdir -p _site/classic
          cp -r app/dist/. _site/
          cp classic/index.html _site/classic/index.html
          touch _site/.nojekyll
          ls -la _site _site/classic _site/next

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
